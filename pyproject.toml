[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mocop"
version = "1.0.0"
description = "Monotone Counterfactual Propagation: counterfactual treatment effects from EHR data through lab and event mediators"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Jingya Cheng"}]
dependencies = [
    "numpy>=1.22",
    "pandas>=1.4",
    "scipy>=1.8",
    "scikit-learn>=1.1",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/clai-group/MoCoP"
Documentation = "https://github.com/clai-group/MoCoP/blob/main/docs/USER_GUIDE.md"

[project.optional-dependencies]
knowledge = ["matplotlib>=3.5"]
test = ["pytest>=7"]

[project.scripts]
mocop = "mocop.cli:main"

[tool.setuptools]
packages = ["mocop"]

[tool.setuptools.package-data]
mocop = ["data/*.csv"]
