# MoCoP example config (synthetic data). Paths are relative to this file.
data:
  cohort: cohort.csv
  labs: labs.csv
  dx: dx.csv
  output_dir: output
columns:
  id: pid
  index_date: index_date
  outcome: outcome
  exposure: exposure
  eligible: eligible
  event_mediator: event
covariates: [age, sex, comorbidity_score, region, prior_event]
edges:
